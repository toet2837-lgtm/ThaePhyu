<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thae Phyu Photography — Capturing Your Story</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Montserrat:wght@300;400;500;600&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ===== WHITE + PINK THEME ===== */
    --pink: #e8a0b8;
    --pink-soft: #f5d5e0;
    --pink-light: #fdf0f4;
    --pink-deep: #d47a9a;
    --rose: #c96b8a;
    
    --white: #ffffff;
    --cream: #fefefe;
    --off-white: #faf8f9;
    
    --text-dark: #2a2a2a;
    --text-gray: #6b6b6b;
    --text-light: #999999;
    
    --border: #f0e5ea;
    --card-bg: #ffffff;
    --shadow: 0 4px 20px rgba(232, 160, 184, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Montserrat', 'Padauk', sans-serif;
    background: var(--white);
    color: var(--text-dark);
    overflow-x: hidden;
    line-height: 1.6;
  }

  .serif { font-family: 'Cormorant Garamond', serif; }

  /* ===== TOP BAR ===== */
  .topbar {
    background: var(--pink-light);
    padding: 10px 60px;
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    color: var(--text-gray);
    border-bottom: 1px solid var(--border);
  }

  .topbar a { color: var(--text-gray); text-decoration: none; transition: color 0.3s; }
  .topbar a:hover { color: var(--pink-deep); }
  .topbar-social { display: flex; gap: 20px; }

  /* ===== NAVIGATION ===== */
  nav {
    position: sticky;
    top: 0;
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(15px);
    z-index: 1000;
    border-bottom: 1px solid var(--border);
    transition: all 0.3s;
  }

  .logo { display: flex; flex-direction: column; line-height: 1; }

  .logo-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--text-dark);
  }

  .logo-main span { color: var(--pink-deep); }

  .logo-sub {
    font-size: 0.6rem;
    letter-spacing: 5px;
    color: var(--text-light);
    margin-top: 4px;
  }

  nav ul {
    display: flex;
    list-style: none;
    gap: 35px;
    align-items: center;
  }

  nav a {
    color: var(--text-dark);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s;
    position: relative;
  }

  nav a::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--pink);
    transition: width 0.3s;
  }

  nav a:hover { color: var(--pink-deep); }
  nav a:hover::after { width: 100%; }

  .nav-book {
    padding: 10px 24px;
    border: 1px solid var(--pink);
    color: var(--pink-deep) !important;
    transition: all 0.3s;
    border-radius: 2px;
  }

  .nav-book:hover { 
    background: var(--pink); 
    color: var(--white) !important; 
    border-color: var(--pink);
  }
  .nav-book::after { display: none; }

  .menu-toggle {
    display: none;
    font-size: 1.5rem;
    color: var(--pink-deep);
    cursor: pointer;
    background: none;
    border: none;
  }

  /* ===== HERO ===== */
  .hero {
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(253, 240, 244, 0.85), rgba(255, 255, 255, 0.75)),
                url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1920') center/cover;
    animation: slowZoom 20s ease-in-out infinite alternate;
    transition: background-image 1s ease;
  }

  @keyframes slowZoom {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), rgba(253, 240, 244, 0.5));
  }

  .hero-content {
    position: relative;
    z-index: 2;
    padding: 0 20px;
    max-width: 950px;
  }

  .hero-tag {
    font-size: 0.75rem;
    letter-spacing: 8px;
    color: var(--pink-deep);
    margin-bottom: 25px;
    animation: fadeUp 1s ease;
  }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 5rem;
    font-weight: 300;
    letter-spacing: 5px;
    line-height: 1.1;
    margin-bottom: 25px;
    color: var(--text-dark);
    animation: fadeUp 1s ease 0.2s backwards;
  }

  .hero h1 em { 
    color: var(--pink-deep); 
    font-style: italic;
    font-weight: 400;
  }

  .hero p {
    font-size: 1rem;
    color: var(--text-gray);
    letter-spacing: 3px;
    margin-bottom: 45px;
    animation: fadeUp 1s ease 0.4s backwards;
  }

  .hero-buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeUp 1s ease 0.6s backwards;
  }

  .btn {
    display: inline-block;
    padding: 16px 42px;
    text-decoration: none;
    letter-spacing: 3px;
    font-size: 0.8rem;
    text-transform: uppercase;
    transition: all 0.4s;
    cursor: pointer;
    border: none;
    font-family: inherit;
    border-radius: 2px;
  }

  .btn-pink { 
    background: var(--pink); 
    color: var(--white); 
    box-shadow: 0 4px 15px rgba(232, 160, 184, 0.4);
  }
  .btn-pink:hover {
    background: var(--pink-deep);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(232, 160, 184, 0.5);
  }

  .btn-outline { 
    border: 1px solid var(--pink); 
    color: var(--pink-deep); 
    background: var(--white); 
  }
  .btn-outline:hover { 
    background: var(--pink); 
    color: var(--white); 
    transform: translateY(-3px); 
  }

  .scroll-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: var(--text-light);
    font-size: 0.7rem;
    letter-spacing: 3px;
    animation: bounce 2s infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(10px); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== STATS ===== */
  .stats {
    background: var(--pink-light);
    padding: 60px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
    border-bottom: 1px solid var(--border);
    border-top: 1px solid var(--border);
  }

  .stat-item { text-align: center; }

  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    color: var(--pink-deep);
    font-weight: 600;
  }

  .stat-label {
    font-size: 0.75rem;
    letter-spacing: 3px;
    color: var(--text-gray);
    margin-top: 8px;
    text-transform: uppercase;
  }

  /* ===== SECTION ===== */
  section { padding: 110px 60px; background: var(--white); }

  .section-head { text-align: center; margin-bottom: 70px; }

  .section-tag {
    font-size: 0.7rem;
    letter-spacing: 6px;
    color: var(--pink-deep);
    margin-bottom: 15px;
    text-transform: uppercase;
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    font-weight: 300;
    letter-spacing: 3px;
    color: var(--text-dark);
  }

  .section-title em { 
    color: var(--pink-deep); 
    font-style: italic; 
    font-weight: 400;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--pink);
    margin: 25px auto 0;
  }

  /* ===== ABOUT ===== */
  .about {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    max-width: 1300px;
    margin: 0 auto;
  }

  .about-img { position: relative; }

  .about-img img {
    width: 100%;
    height: 600px;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: var(--shadow);
  }

  .about-img::before {
    content: '';
    position: absolute;
    top: -20px;
    left: -20px;
    width: 100%;
    height: 100%;
    border: 2px solid var(--pink-soft);
    z-index: -1;
    border-radius: 4px;
  }

  .about-text h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 25px;
    line-height: 1.2;
    color: var(--text-dark);
  }

  .about-text h2 em { color: var(--pink-deep); font-style: italic; font-weight: 400; }

  .about-text p {
    color: var(--text-gray);
    margin-bottom: 20px;
    font-size: 0.95rem;
    line-height: 1.9;
  }

  .about-sign {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: var(--pink-deep);
    font-style: italic;
    margin-top: 30px;
  }

  /* ===== SERVICES ===== */
  .services { background: var(--pink-light); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .service-card {
    background: var(--white);
    padding: 50px 35px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(232, 160, 184, 0.08);
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, var(--pink-soft), var(--pink), var(--pink-soft));
    transform: scaleX(0);
    transition: transform 0.4s;
  }

  .service-card:hover::before { transform: scaleX(1); }

  .service-card:hover {
    border-color: var(--pink-soft);
    transform: translateY(-10px);
    box-shadow: 0 20px 40px rgba(232, 160, 184, 0.25);
  }

  .service-icon { font-size: 2.8rem; margin-bottom: 25px; }

  .service-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 15px;
    color: var(--pink-deep);
  }

  .service-card p { color: var(--text-gray); font-size: 0.9rem; line-height: 1.8; margin-bottom: 20px; }

  .service-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--text-dark);
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-weight: 600;
  }

  /* ===== PORTFOLIO ===== */
  .portfolio-filter {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 55px;
  }

  .filter-btn {
    padding: 12px 28px;
    background: var(--white);
    border: 1px solid var(--border);
    color: var(--text-gray);
    letter-spacing: 2px;
    font-size: 0.75rem;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    border-radius: 2px;
  }

  .filter-btn:hover,
  .filter-btn.active {
    border-color: var(--pink);
    color: var(--white);
    background: var(--pink);
    box-shadow: 0 4px 15px rgba(232, 160, 184, 0.35);
  }

  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .portfolio-item {
    position: relative;
    overflow: hidden;
    aspect-ratio: 4/5;
    cursor: pointer;
    background: var(--pink-light);
    border-radius: 4px;
  }

  .portfolio-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.8s ease;
    display: block;
  }

  .portfolio-item:hover img { transform: scale(1.1); }

  .portfolio-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(212, 122, 154, 0.95), transparent 65%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 30px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .portfolio-item:hover .portfolio-overlay { opacity: 1; }

  .portfolio-cat {
    font-size: 0.7rem;
    letter-spacing: 3px;
    color: var(--pink-soft);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .portfolio-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--white);
  }

  /* ===== LIGHTBOX ===== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 40px;
    animation: fadeIn 0.3s ease;
  }

  .lightbox.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .lightbox img {
    max-width: 90%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(232, 160, 184, 0.3);
  }

  .lightbox-close {
    position: absolute;
    top: 25px;
    right: 35px;
    color: var(--white);
    font-size: 2.5rem;
    cursor: pointer;
    background: none;
    border: none;
    transition: color 0.3s;
    font-family: inherit;
    line-height: 1;
  }

  .lightbox-close:hover { color: var(--pink); }

  .lightbox-caption {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    text-align: center;
    padding: 10px 25px;
    background: rgba(212, 122, 154, 0.4);
    border-radius: 4px;
    backdrop-filter: blur(10px);
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: var(--white);
    font-size: 1.8rem;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    font-family: inherit;
  }

  .lightbox-nav:hover {
    background: var(--pink);
    border-color: var(--pink);
  }

  .lightbox-prev { left: 25px; }
  .lightbox-next { right: 25px; }

  /* ===== PROCESS ===== */
  .process { background: var(--pink-light); }

  .process-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .process-step { text-align: center; }

  .process-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 4rem;
    color: var(--pink-soft);
    font-weight: 700;
    line-height: 1;
    margin-bottom: -20px;
  }

  .process-step h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    color: var(--pink-deep);
    margin-bottom: 15px;
    letter-spacing: 2px;
    position: relative;
    font-weight: 600;
  }

  .process-step p { color: var(--text-gray); font-size: 0.88rem; line-height: 1.8; }

  /* ===== TESTIMONIALS ===== */
  .testimonials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .testimonial {
    background: var(--white);
    padding: 45px 35px;
    border-left: 3px solid var(--pink);
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(232, 160, 184, 0.12);
    transition: all 0.3s;
  }

  .testimonial:hover {
    box-shadow: 0 10px 30px rgba(232, 160, 184, 0.25);
    transform: translateY(-5px);
  }

  .testimonial-quote {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    color: var(--pink);
    line-height: 0.5;
    margin-bottom: 20px;
  }

  .testimonial p {
    color: var(--text-gray);
    font-style: italic;
    line-height: 1.9;
    margin-bottom: 25px;
    font-size: 0.95rem;
  }

  .testimonial-author { display: flex; align-items: center; gap: 15px; }

  .testimonial-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--pink-soft);
  }

  .testimonial-name { font-weight: 600; font-size: 0.9rem; letter-spacing: 1px; color: var(--text-dark); }
  .testimonial-role { font-size: 0.75rem; color: var(--text-light); letter-spacing: 1px; }

  /* ===== PRICING ===== */
  .pricing { background: var(--pink-light); }

  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .price-card {
    background: var(--white);
    padding: 50px 35px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: all 0.4s;
    position: relative;
    box-shadow: 0 2px 10px rgba(232, 160, 184, 0.08);
  }

  .price-card.featured {
    border-color: var(--pink);
    transform: scale(1.03);
    box-shadow: 0 10px 40px rgba(232, 160, 184, 0.3);
  }

  .price-card.featured::before {
    content: 'POPULAR';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--pink);
    color: var(--white);
    padding: 5px 20px;
    font-size: 0.65rem;
    letter-spacing: 3px;
    font-weight: 600;
    border-radius: 2px;
  }

  .price-card:hover { 
    border-color: var(--pink); 
    transform: translateY(-8px);
    box-shadow: 0 15px 40px rgba(232, 160, 184, 0.3);
  }
  .price-card.featured:hover { transform: scale(1.03) translateY(-8px); }

  .price-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    letter-spacing: 3px;
    color: var(--pink-deep);
    margin-bottom: 15px;
    font-weight: 600;
  }

  .price-amount {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--text-dark);
  }

  .price-amount span {
    font-size: 1rem;
    color: var(--text-light);
    font-family: 'Montserrat', sans-serif;
  }

  .price-desc {
    font-size: 0.8rem;
    color: var(--text-light);
    letter-spacing: 1px;
    margin-bottom: 30px;
  }

  .price-features {
    list-style: none;
    text-align: left;
    margin-bottom: 35px;
    border-top: 1px solid var(--border);
    padding-top: 25px;
  }

  .price-features li {
    padding: 10px 0;
    color: var(--text-gray);
    font-size: 0.88rem;
    border-bottom: 1px solid var(--border);
  }

  .price-features li::before {
    content: '✓';
    color: var(--pink-deep);
    margin-right: 12px;
    font-weight: 600;
  }

  /* ===== BOOKING ===== */
  .booking-form {
    max-width: 800px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .form-group { display: flex; flex-direction: column; }
  .form-group.full { grid-column: 1 / -1; }

  .form-group label {
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--pink-deep);
    margin-bottom: 10px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    background: var(--white);
    border: 1px solid var(--border);
    padding: 15px;
    color: var(--text-dark);
    font-family: inherit;
    font-size: 0.9rem;
    transition: all 0.3s;
    outline: none;
    border-radius: 2px;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { 
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(232, 160, 184, 0.15);
  }

  .form-group textarea { resize: vertical; min-height: 130px; }

  .form-submit { grid-column: 1 / -1; text-align: center; margin-top: 15px; }

  /* ===== CONTACT ===== */
  .contact { background: var(--pink-light); }

  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 70px;
    max-width: 1200px;
    margin: 0 auto;
